<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
    <meta name="description" content="An open-source PICO-8-compatible player. Play local cartridges in your browser or create a game with PICO-8 Maker.">
    <title>PICO-8 Player</title>
  </head>
  <body class="demo-page" data-status="loading" data-progress="manifest">
    <header class="project-header">
      <span class="project-name">PICO-8 PLAYER</span>
      <nav class="project-links" aria-label="Project links">
        <a href="https://boxuechen.github.io/pico8-maker/" target="_blank" rel="noopener noreferrer">Maker</a>
        <a href="https://github.com/boxuechen/pico8-player" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com/boxuechen" target="_blank" rel="noopener noreferrer" aria-label="Follow @boxuechen on X">X</a>
      </nav>
    </header>
    <main class="release-demo">
      <h1>PICO-8 Player</h1>
      <p>Play a local <code>.p8</code> or <code>.p8.png</code> cartridge. Your games stay in this browser and are never uploaded.</p>
      <div id="player"></div>
      <output id="release-status" aria-live="polite"></output>
    </main>
    <footer class="project-footer">
      <p>Open source. Built for play and creation.</p>
      <nav aria-label="Player resources">
        <a href="https://github.com/boxuechen/pico8-player/blob/main/docs/player.md" target="_blank" rel="noopener noreferrer">Embed the player</a>
        <a href="../manifest.json">Build manifest</a>
        <a href="../THIRD_PARTY_NOTICES.md">Credits &amp; licenses</a>
      </nav>
      <p>Independent project. Not affiliated with Lexaloffle.</p>
    </footer>
    <script type="module" src="./demo.mjs"></script>
  </body>
</html>

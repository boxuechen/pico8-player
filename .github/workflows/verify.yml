name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/checkout@v5
        with:
          repository: emscripten-core/emsdk
          ref: 17a714fde0f1aaac53d282efcc6093b377addc8d
          path: .cache/emsdk
      - run: .cache/emsdk/emsdk install 6.0.5
      - run: .cache/emsdk/emsdk activate 6.0.5
      - run: echo "EMSDK=$GITHUB_WORKSPACE/.cache/emsdk" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version || chromium --version
      - run: pnpm run build:wasm
      - run: pnpm run verify
      - run: pnpm run verify:release
      - run: pnpm run test:browser

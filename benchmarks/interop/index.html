<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 0C Interop Microbenchmark</title>
    <style>
      body { max-width: 70rem; margin: 2rem auto; padding: 0 1rem; font: 15px/1.5 ui-monospace, monospace; color: #17202a; }
      pre { padding: 1rem; overflow: auto; background: #f4f6f7; border: 1px solid #d5d8dc; }
      .error { color: #922b21; }
    </style>
  </head>
  <body data-status="booting" data-progress="">
    <h1>Phase 0C Interop Microbenchmark</h1>
    <p id="status">Starting dedicated Worker…</p>
    <pre id="result" aria-live="polite"></pre>
    <script type="module">
      const status = document.querySelector("#status");
      const output = document.querySelector("#result");
      const worker = new Worker("./worker.mjs", { type: "module", name: "phase-0c-interop" });
      worker.addEventListener("message", ({ data }) => {
        if (data.type === "progress") {
          const text = `${data.progress.stage} ${data.progress.current}/${data.progress.total}: ${data.progress.caseId}`;
          document.body.dataset.status = "running";
          document.body.dataset.progress = text;
          status.textContent = text;
        } else if (data.type === "complete") {
          document.body.dataset.status = "complete";
          document.body.dataset.progress = "complete";
          status.textContent = "Complete";
          output.textContent = JSON.stringify(data.result);
          worker.terminate();
        } else if (data.type === "error") {
          document.body.dataset.status = "error";
          status.textContent = "Failed";
          output.className = "error";
          output.textContent = data.error;
          worker.terminate();
        }
      });
      worker.addEventListener("error", (event) => {
        document.body.dataset.status = "error";
        output.textContent = event.message;
      });
      worker.postMessage({ type: "run", smoke: new URL(location.href).searchParams.has("smoke") });
    </script>
  </body>
</html>

schema_version: 1
target: pico8-0.2.7-player
owner: packages/runtime-core
status_values:
  - unimplemented
  - partial
  - implemented
  - unsupported
apis:
  - name: cls
    status: implemented
    owner: packages/runtime-core
    phase: 1A
    note: standard-4bpp mapped screen clear with clip/cursor reset; advanced screen modes excluded
  - name: pset
    status: implemented
    owner: packages/runtime-core
    phase: 1A
    note: RAM-backed pen, camera, clip, draw palette, fill pattern and secondary-global mapping in standard 4bpp
  - name: btn
    status: implemented
    owner: packages/runtime-core
    phase: 3C
    note: synchronous generated binding to TS; fixed eight-player six-button snapshot, 0x5f4c..0x5f53 registers and P0/P1 no-argument bitfield; active 3D may add the documented devkit mouse button 6 overlay
  - name: line
    status: implemented
    owner: packages/runtime-core
    phase: 1D
    note: integer raster with optional colour, RAM-backed continuation and full Phase 2B draw state
  - name: rect
    status: implemented
    owner: packages/runtime-core
    phase: 1D
    note: reversed inclusive standard-4bpp outline with camera, clip, palette and fill pattern
  - name: rectfill
    status: implemented
    owner: packages/runtime-core
    phase: 1D
    note: reversed inclusive standard-4bpp fill with camera, clip, palette, fill pattern and inversion
  - name: circ
    status: implemented
    owner: packages/runtime-core
    phase: 1D
    note: integer outline with default/negative radius and full Phase 2B draw state
  - name: circfill
    status: implemented
    owner: packages/runtime-core
    phase: 1D
    note: integer fill with default/negative radius, Phase 2B draw state and inversion
  - name: btnp
    status: implemented
    owner: packages/runtime-core
    phase: 3C
    note: independent player 0..7 six-button logical-tick edge/repeat with 0x5f5c/0x5f5d overrides; keyboard P0/P1, standard Gamepad and multitouch sources merge in the app
  - name: time
    aliases: [t]
    status: partial
    owner: packages/runtime-core
    phase: 0E
    note: Q16.16 committed-slice time; official Web Player locks startup to 1/30 second
  - name: flip
    status: partial
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 0E
    note: root top-level continuation implemented; guest-nested suspension unsupported
  - name: peek
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: canonical scalar and bounded 8192-result reads
  - name: peek2
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: unaligned little-endian read through the canonical per-byte mapper
  - name: peek4
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: signed Q16.16 raw bits over canonical byte-wise mapper
  - name: poke
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: canonical scalar and bounded 8192-value writes with preflight arity validation
  - name: poke2
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: unaligned little-endian write through the canonical per-byte mapper
  - name: poke4
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: raw Q16.16 bits over canonical byte-wise mapper
  - name: memcpy
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: canonical logical mapping with overlap-safe source snapshot
  - name: memset
    status: implemented
    owner: wasm/bridge/p8w_frame_runtime.cpp
    phase: 2A
    note: canonical logical mapping and bounded deterministic fill
  - name: color
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: RAM-backed 8-bit primary/alternate pen with previous-value result
  - name: camera
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: RAM-backed signed int16 offset observed by standard-4bpp draw/read operations
  - name: clip
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: RAM-backed exclusive rectangle with reset and intersect mode
  - name: pal
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: scalar/table reset and draw/display/secondary mappings; display supports 0x80..0x8f
  - name: palt
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: scalar boolean and 16-bit mask forms share draw-palette transparency bits
  - name: fillp
    status: implemented
    owner: packages/runtime-core
    phase: 2C
    note: primitives and sprites share RAM-backed pattern, transparency, apply-to-sprites, secondary-global and colour override/inversion flags
  - name: pget
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: mapped logical screen index with camera/clip and documented custom out-of-bounds register
  - name: oval
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: deterministic reversed/fractional standard-4bpp ellipse with Phase 2B draw state
  - name: ovalfill
    status: implemented
    owner: packages/runtime-core
    phase: 2B
    note: deterministic standard-4bpp fill with Phase 2B draw state and inversion
  - name: sget
    status: implemented
    owner: packages/runtime-core
    phase: 2C
    note: canonical mapped GFX nibble read with fractional/bounds and custom out-of-bounds behavior
  - name: sset
    status: implemented
    owner: packages/runtime-core
    phase: 2C
    note: canonical mapped GFX nibble write with optional pen and draw-palette mapping
  - name: spr
    status: implemented
    owner: packages/runtime-core
    phase: 2C
    note: standard-4bpp fractional sprite extents, camera, clip, flip, palette, transparency and fill-pattern path
  - name: sspr
    status: implemented
    owner: packages/runtime-core
    phase: 2C
    note: deterministic nearest source sampling with scaling, negative destination dimensions and sprite draw state
  - name: mget
    status: implemented
    owner: packages/runtime-core
    phase: 2D
    note: RAM-backed lower-ring and upper-region map resolver with width, alias and custom out-of-bounds behavior
  - name: mset
    status: implemented
    owner: packages/runtime-core
    phase: 2D
    note: bounded physical map write through the same live base/width resolver as mget/map/tline
  - name: fget
    status: implemented
    owner: packages/runtime-core
    phase: 2D
    note: whole-byte and boolean bit reads over canonical 0x3000 sprite flags
  - name: fset
    status: implemented
    owner: packages/runtime-core
    phase: 2D
    note: whole-byte and optional-boolean bit writes with invalid index no-op behavior
  - name: map
    status: implemented
    owner: packages/runtime-core
    phase: 2D
    note: bounded visible tile raster with defaults, camera, clip, layers, sprite-zero override and shared sprite draw state
  - name: tline
    status: partial
    owner: packages/runtime-core
    phase: 2D
    note: signed Q16.16 tile-coordinate sampler with default/explicit deltas, RAM masks/offsets and layers; one-argument precision mode deferred
  - name: print
    status: partial
    owner: packages/runtime-core
    phase: 2E
    note: byte-oriented built-in/custom font raster plus Phase 3B synchronous P8SCII audio side effects; timed frame delays remain intentionally deferred
  - name: cursor
    status: implemented
    owner: packages/runtime-core
    phase: 2E
    note: RAM-backed cursor, print-home and optional pen update through generated host binding
  - name: sfx
    status: implemented
    owner: packages/runtime-core
    phase: 3A
    note: deterministic four-channel live-RAM SFX core, typed binding 31, exact 22050Hz PCM slice clock and project golden; official bit-exact waveform parity remains unclaimed
  - name: music
    status: implemented
    owner: packages/runtime-core
    phase: 3B
    note: typed binding 32, live 64-pattern sequencer, channel arbitration/fade, P8SCII audio and production dedicated-port AudioWorklet output; project oracle is not official bit-exact audio
  - name: stat
    status: partial
    owner: packages/runtime-core
    phase: 3D
    note: documented devkit input selectors 30,31,32,33,34,36,38,39 are implemented through typed binding 33; complete stat remains deferred
  - name: cartdata
    status: implemented
    owner: packages/runtime-core
    phase: 3E
    note: synchronous one-shot validated slot selection through binding 34; prehydrated 256-byte seed is copied into live 0x5e00 RAM and the boolean reports seed presence
  - name: dget
    status: implemented
    owner: packages/runtime-core
    phase: 3E
    note: binding 35 returns signed Q16.16 raw little-endian values from the selected live 0x5e00 cartdata region
  - name: dset
    status: implemented
    owner: packages/runtime-core
    phase: 3E
    note: binding 36 writes signed Q16.16 raw little-endian values; committed transaction snapshots also detect direct RAM writes
  - name: reload
    status: unimplemented
    owner: packages/runtime-core
    phase: 3G
    note: only current-cart synchronous ROM/overlay path is planned; external refs remain unsupported
  - name: cstore
    status: unimplemented
    owner: packages/runtime-core
    phase: 3G
    note: only current-cart copy-on-write overlay path is planned; source bytes remain immutable

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 7G Chrome hardening gate</title>
    <style>
      :root { color-scheme: dark; background: #090b10; color: #f2f4ff; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(94vw, 38rem); display: grid; gap: 1rem; }
      #start { min-height: 3rem; font: inherit; }
      #secondary { position: fixed; left: -10000px; top: 0; width: 320px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body data-status="loading" data-progress="boot">
    <main>
      <button id="start" type="button" disabled>Start release candidate</button>
      <section id="player"></section>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <section id="secondary"></section>
    <script type="module" src="./phase-7g.mjs"></script>
  </body>
</html>
